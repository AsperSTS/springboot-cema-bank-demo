spring.application.name=CemaBank
spring.datasource.url=${CEMA_DB_URL:jdbc:postgresql://localhost:5433/cema_bank}
spring.datasource.username=${CEMA_DB_USER:cema_admin}
spring.datasource.password=${CEMA_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
server.port=${PORT:8080}
server.address=${CEMA_BIND_ADDRESS:127.0.0.1}
server.error.include-message=never
cema.cors.origins=${CEMA_CORS_ORIGINS:http://localhost:5173,http://localhost:5174}
cema.demo.enabled=${CEMA_DEMO_MODE:false}
